
name: PUDL RUS12 PR 5749 Tests

on:
  workflow_dispatch:
  push:
    branches:
      - test-5749-rus12-rebuild

jobs:
  rus12-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out PR code (read-only)
        uses: actions/checkout@v4
        with:
          repository: addisalem-aw/pudl
          ref: issue-5728-rus12-assets-validation

      - name: Set up Pixi
        uses: prefix-dev/setup-pixi@v0.9.1
        with:
          pixi-version: latest

      - name: Install PUDL dependencies
        run: pixi install --locked

      - name: Create dbt profiles directory
        run: mkdir -p ~/.dbt
        
      - name: Inspect dbt profile configuration
        run: |
          echo "Project profile:"
          grep -n "^profile:" dbt/dbt_project.yml
          echo "Generated profile file:"
          cat ~/.dbt/profiles.yml
          echo "dbt profile lookup:"
          pixi run dbt debug --project-dir dbt --profiles-dir ~/.dbt  
 
      - name: Configure dbt profile
        run: |
          cat > ~/.dbt/profiles.yml <<'YAML'
          pudl_duckdb:
            target: dev
            outputs:
              dev:
                type: duckdb
                path: ":memory:"
                schema: main
                threads: 4
          YAML

      - name: Show checked-out branch and commit
        run: |
          git branch --show-current
          git log -1 --oneline
