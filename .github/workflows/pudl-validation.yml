
name: PUDL RUS12 PR 5749 Tests

on:
  workflow_dispatch:
  push:
    branches:
      - test-5749-rus12-rebuild

jobs:
  rus12-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out PR code (read-only)
        uses: actions/checkout@v4
        with:
          repository: addisalem-aw/pudl
          ref: issue-5728-rus12-assets-validation

      - name: Set up Pixi
        uses: prefix-dev/setup-pixi@v0.9.1
        with:
          pixi-version: latest

      - name: Install PUDL dependencies
        run: pixi install --locked

      - name: Create dbt profiles directory
        run: mkdir -p ~/.dbt

      - name: Check dbt configuration
        run: pixi run dbt parse --project-dir dbt

      - name: Show checked-out branch and commit
        run: |
          git branch --show-current
          git log -1 --oneline
