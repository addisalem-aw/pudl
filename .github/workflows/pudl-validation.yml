
name: PUDL RUS12 PR 5749 Tests

on:
  workflow_dispatch:
  push:
    branches:
      - test-5749-rus12-rebuild

jobs:
  rus12-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out PR code (read-only)
        uses: actions/checkout@v4
        with:
          repository: addisalem-aw/pudl
          ref: issue-5728-rus12-assets-validation

      - name: Set up Pixi
        uses: prefix-dev/setup-pixi@v0.9.1
        with:
          pixi-version: latest

      - name: Install PUDL dependencies
        run: pixi install --locked

      - name: Configure dbt profile
        run: |
          mkdir -p .dbt
          cat > .dbt/profiles.yml <<'YAML'
          pudl_duckdb:
            target: dev
            outputs:
              dev:
                type: duckdb
                path: ":memory:"
                schema: main
                threads: 4
          YAML

          echo "Created dbt profile:"
          cat .dbt/profiles.yml
      
      - name: Configure PUDL environment
        run: |
          mkdir -p "$RUNNER_TEMP/pudl-input"
          mkdir -p "$RUNNER_TEMP/pudl-output"

          echo "PUDL_INPUT=$RUNNER_TEMP/pudl-input" >> "$GITHUB_ENV"
          echo "PUDL_OUTPUT=$RUNNER_TEMP/pudl-output" >> "$GITHUB_ENV"
      - name: Inspect dbt profile configuration
        run: |
          echo "Project profile:"
          grep -n "^profile:" dbt/dbt_project.yml

          echo "dbt profile lookup:"
          pixi run dbt debug \
            --project-dir dbt \
            --profiles-dir .dbt

      - name: Check dbt configuration
        run: |
          pixi run dbt parse \
            --project-dir dbt \
            --profiles-dir .dbt

      - name: Show checked-out branch and commit
        run: |
          git branch --show-current
          git log -1 --oneline
